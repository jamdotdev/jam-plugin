name: Skill idea
description: A job coding agents should do with a Jam, about QA, pull requests or proof of work.
labels: [skill-request]
body:
  - type: textarea
    id: job
    attributes:
      label: The job
      description: 'What goes in and what comes out. For example, "PR diff in, five things a tester must check by hand out."'
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What agents get wrong today
      description: What happens when you ask an agent to do this without a skill?
    validations:
      required: true
