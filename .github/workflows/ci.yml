name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install check dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Repo checks
        run: node scripts/check.mjs

      - name: Plugin manifest
        run: npx -y @anthropic-ai/claude-code@latest plugin validate . --strict

      - name: skills.sh sees every skill
        run: |
          npx -y skills@latest add . --list </dev/null > skills.txt 2>&1
          node scripts/check.mjs --skills-list skills.txt || { cat skills.txt; exit 1; }
