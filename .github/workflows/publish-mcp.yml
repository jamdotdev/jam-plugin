name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # MCP_PRIVATE_KEY is an environment secret; the environment only allows v* tags.
    environment: mcp-registry-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          V="$(jq -r .version server.json)"
          test "$TAG" = "$V" || { echo "tag v$TAG != server.json $V"; exit 1; }

      - name: Install mcp-publisher
        run: curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Validate
        run: ./mcp-publisher validate server.json

      - name: Authenticate (DNS, jam.dev)
        run: ./mcp-publisher login dns --domain jam.dev --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish
        run: ./mcp-publisher publish server.json
